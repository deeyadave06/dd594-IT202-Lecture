<!DOCTYPE html> 
<html> 
<head> 
<title>Changing Properties with jQuery</title> 
<p>Deeya Dave, IT-202-003, Internet Applications, Unit 13 In-Class Exercise, dd594@njit.edu, 12/3/2025</p>
</head> 
<style> 
    div { 
        background-color:yellow; 
    } 
</style> 
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script> 
<script> 
    jQuery(document).ready(function() { 
        $("button").click(function() { 
            $("p").css("background-color", "red"); 
            $("p").css("font-size", "50px"); 
        }); 
    });
    jQuery(document).ready(function() { 
        $("#secButton").click(function() { 
            $("h1").css("background-color", "blue"); 
            $("h1").css("font-size", "25px"); 
            $("h1").css("font-family", "Arial");
            $("h1").text("You clicked the second button!");
        }); 
    });

</script> 
<body> 
    <div id="container"> 
        <h1>This is my heading</h1> 
        <p>This is some content on my web page</p> 
        <button>Test button</button> 
        <button id="secButton">Second Button</button>
    </div> 
</body> 
</html>
