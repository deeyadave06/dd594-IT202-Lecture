<!DOCTYPE html> 
<html> 
<head> 
<title>Testing Mouse Events</title> 
<p>Deeya Dave, IT-202-003, Internet Applications, Unit 13 In-Class Exercise, dd594@njit.edu, 12/3/2025</p>
<style> 
    .yellow { 
        background-color: yellow; 
        width: 400px; 
    } 
    .red { 
        background-color: red; 
        width: 400px; 
    } 
</style> 
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script> 
<script> 
    jQuery(document).ready( function() { 
        $("p").hover( function() { 
            $(this).addClass("red"); }, 
        function() { 
            $(this).removeClass("red"); }); 
    }); 
</script> 
</head> 
<body> 
<h1>This is a test of the mouse events</h1> 
<p class="yellow">This is some content that will change color!</p> 
<p>This is some content that will change color, too!</p> 
</body> 
</html>
